<VirtualHost *:80>
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/sites/%1

    <Directory /var/www/sites>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/webdev-error.log
    CustomLog ${APACHE_LOG_DIR}/webdev-access.log combined
</VirtualHost>
